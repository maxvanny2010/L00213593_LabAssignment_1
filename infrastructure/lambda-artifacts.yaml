AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  ATU CloudFormation Lab - S3 bucket for Java Lambda deployment artifacts.

Resources:

  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketNamePrefix: atu-l00213593-lambda
      BucketNamespace: account-regional

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLambdaArtifacts
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:

  LambdaArtifactsBucketName:
    Description: S3 bucket for Lambda deployment artifacts
    Value: !Ref LambdaArtifactsBucket
    Export:
      Name: ATU-Lambda-ArtifactsBucketName

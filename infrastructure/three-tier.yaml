AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  ATU CloudFormation Lab - Part A(b).
  Three-tier architecture using API Gateway, Java Lambda and DynamoDB.

Parameters:

  LambdaArtifactVersion:
    Type: String
    Description: S3 object version ID of the uploaded Java Lambda JAR

Resources:

  # Store messages submitted through the application
  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${AWS::StackName}-messages'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: false
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: ATU-CloudFormation-Lab
        - Key: StudentNumber
          Value: L00213593
        - Key: Component
          Value: DatabaseTier

  # Execution role for the Java Lambda function
  MessageLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: MessagesTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt MessagesTable.Arn

  # Java application running on AWS Lambda
  MessageLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Java Lambda for the ATU Student Message Board
      Runtime: java21
      Handler: ie.atu.lab.MessageHandler::handleRequest
      Role: !GetAtt MessageLambdaRole.Arn

      Code:
        S3Bucket:
          Fn::ImportValue: ATU-Lambda-ArtifactsBucketName
        S3Key: lambda/student-message-board-1.0-SNAPSHOT.jar
        S3ObjectVersion: !Ref LambdaArtifactVersion

      MemorySize: 512
      Timeout: 15

      Environment:
        Variables:
          TABLE_NAME: !Ref MessagesTable

  # Create an HTTP API with Lambda integration using Quick Create
  MessageHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ATU-Student-Message-Board-API
      Description: HTTP API for the ATU Student Message Board
      ProtocolType: HTTP
      RouteKey: 'GET /message'
      Target: !Sub
        - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
        - LambdaArn: !GetAtt MessageLambdaFunction.Arn
      CorsConfiguration:
        AllowOrigins:
          - 'https://d2caxeghfi5itf.cloudfront.net'
        AllowMethods:
          - GET
        AllowHeaders:
          - content-type
        MaxAge: 300

  # Lambda integration for POST /message
  MessagePostIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MessageHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MessageLambdaFunction.Arn
      PayloadFormatVersion: '2.0'

  # Route POST /message through the CloudFormation-managed Lambda integration
  MessagePostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MessageHttpApi
      RouteKey: 'POST /message'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${MessagePostIntegration}'

  # Allow the HTTP API to invoke the Java Lambda function
  MessageApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MessageLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MessageHttpApi}/*/GET/message'

  # Allow API Gateway to invoke Java Lambda through POST /message
  MessagePostLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MessageLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MessageHttpApi}/*/POST/message'

  # Allow the lab IAM user to invoke only POST /message
  MessagePostClientPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ATU-MessagePost-Invoke
      Users:
        - atu-devops-lab
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeMessagePostOnly
            Effect: Allow
            Action:
              - execute-api:Invoke
            Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MessageHttpApi}/*/POST/message'

Outputs:

  MessagesTableName:
    Description: Name of the DynamoDB messages table
    Value: !Ref MessagesTable

  MessageApiEndpoint:
    Description: HTTPS endpoint for the Student Message Board API
    Value: !Sub '${MessageHttpApi.ApiEndpoint}/message'


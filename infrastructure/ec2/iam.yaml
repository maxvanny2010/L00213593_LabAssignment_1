AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ATU CloudFormation Lab - IAM role, managed policy
  and instance profile for the EC2 Java application.

Resources:

  # The EC2 service can assume this role.
  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM role for the EC2 Java application

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: ATU-EC2-Application-Role
        - Key: Project
          Value: ATU-CloudFormation-Lab
        - Key: ManagedBy
          Value: CloudFormation

  # Permissions are managed separately from the role.
  ApplicationManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Restricted DynamoDB access for EC2

      Roles:
        - !Ref ApplicationRole

      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # Read and write messages in the existing table.
          - Sid: ReadAndWriteMessages
            Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:PutItem
            Resource:
              Fn::Sub:
                - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                - TableName:
                    Fn::ImportValue: ATU-Three-Tier-MessagesTableName

          - Sid: GetECRAuthorizationToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"

          - Sid: PullApplicationImageFromECR
            Effect: Allow
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/atu-ec2-app


  # EC2 uses this instance profile to obtain role credentials.
  ApplicationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ApplicationRole

Outputs:

  ApplicationRoleArn:
    Description: IAM role ARN
    Value: !GetAtt ApplicationRole.Arn

  ApplicationManagedPolicyArn:
    Description: Managed policy ARN
    Value: !Ref ApplicationManagedPolicy

  ApplicationInstanceProfileName:
    Description: Instance profile name for EC2 deployment
    Value: !Ref ApplicationInstanceProfile
    Export:
      Name: ATU-EC2-ApplicationInstanceProfileName

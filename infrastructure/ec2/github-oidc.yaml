AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  GitHub Actions OIDC authentication for the ATU DevOps
  Docker deployment pipeline.

Resources:

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ATU-GitHub-Actions-ECR

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:maxvanny2010@39569512/L00213593_LabAssignment_1@1410842561:ref:refs/heads/master

  GitHubECRPushPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Least privilege permissions for GitHub Actions
        to publish Docker images to Amazon ECR.

      Roles:
        - !Ref GitHubActionsRole

      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Sid: ECRAuthentication
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'

          - Sid: PushApplicationImages
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:CompleteLayerUpload
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:PutImage
              - ecr:BatchGetImage
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/atu-ec2-app


Outputs:

  GitHubActionsRoleArn:
    Description: IAM Role ARN for GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn

  GitHubOIDCProviderArn:
    Description: GitHub OIDC Provider ARN
    Value: !Ref GitHubOIDCProvider
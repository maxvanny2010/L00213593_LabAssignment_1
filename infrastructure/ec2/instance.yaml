AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  ATU CloudFormation Lab - EC2 instance infrastructure.

Parameters:

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: EC2 instance type for the Java application

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI

  DockerImageUri:
    Type: String
    Default: ghcr.io/maxvanny2010/atu-ec2-app:placeholder
    Description: Full Docker image URI including tag or digest
  DynamoTableName:
      Type: String
      Default: ATU-Three-Tier-messages
      Description: DynamoDB table used by the EC2 application

Resources:

  ApplicationInstance:
    Type: AWS::EC2::Instance

    Properties:

      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId

      IamInstanceProfile:
        Fn::ImportValue: ATU-EC2-ApplicationInstanceProfileName

      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true

          SubnetId:
            Fn::ImportValue: ATU-EC2-PublicSubnetId

          GroupSet:
            - Fn::ImportValue: ATU-EC2-ApplicationSecurityGroupId

      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required

      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true

      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euxo pipefail

            # Start SSM Agent
            systemctl enable --now amazon-ssm-agent

            # Install Docker
            dnf install -y docker
            systemctl enable --now docker

            # Download application image
            docker pull "${DockerImageUri}"

            # Start Java application
            docker run -d \
              --name atu-ec2-app \
              --restart unless-stopped \
              --user 10001:10001 \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=32m \
              --memory 256m \
              --cpus 0.5 \
              --pids-limit 128 \
              -p 127.0.0.1:8080:8080 \
              -e HOST=0.0.0.0 \
              -e PORT=8080 \
              -e AWS_REGION="${AWS::Region}" \
              -e TABLE_NAME="${DynamoTableName}" \
              "${DockerImageUri}"

            # Verify application startup
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/health; then
                break
              fi
              sleep 2
            done

            # Verify application and DynamoDB
            curl -fsS http://127.0.0.1:8080/health
            curl -fsS http://127.0.0.1:8080/message

      Tags:
        - Key: Name
          Value: ATU-EC2-Java-Application

        - Key: Project
          Value: ATU-CloudFormation-Lab

        - Key: ManagedBy
          Value: CloudFormation

Outputs:

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref ApplicationInstance

  PrivateIp:
    Description: EC2 private IPv4 address
    Value: !GetAtt ApplicationInstance.PrivateIp

  PublicIp:
    Description: EC2 public IPv4 address
    Value: !GetAtt ApplicationInstance.PublicIp

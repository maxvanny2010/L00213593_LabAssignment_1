AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  ATU CloudFormation Lab - bootstrap permissions
  for deploying the EC2 network stack.

Parameters:
  DeveloperGroupName:
    Type: String
    Default: ATU-DevOps-Lab-Developers
    Description: Existing IAM developer group

Resources:

  NetworkDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Permissions for the ATU EC2 network CloudFormation stack.

      Groups:
        - !Ref DeveloperGroupName

      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Sid: ManageEC2NetworkStack
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:GetTemplateSummary
              - cloudformation:ContinueUpdateRollback
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ATU-EC2-Network/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ATU-EC2-SecurityGroup/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ATU-EC2-Instance/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ATU-GitHub-OIDC/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ATU-EC2-IAM/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ATU-EC2-ECR/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*

          - Sid: ManageNetworkResources
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:ReplaceRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeVpcs
              - ec2:DescribeSubnets
              - ec2:DescribeInternetGateways
              - ec2:DescribeRouteTables
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeAccountAttributes
            Resource: '*'

          - Sid: ListCloudFormationExports
            Effect: Allow
            Action:
              - cloudformation:ListExports
            Resource: "*"
          - Sid: ManageApplicationSecurityGroup
            Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSecurityGroupRules
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupEgress
            Resource: "*"

          - Sid: ManageEC2ApplicationRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:GetRole
              - iam:DeleteRole
              - iam:UpdateAssumeRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:ListAttachedRolePolicies
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ATU-EC2-IAM-*

          - Sid: ManageEC2ApplicationManagedPolicy
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ATU-EC2-IAM-*

          - Sid: ManageEC2ApplicationInstanceProfile
            Effect: Allow
            Action:
              - iam:CreateInstanceProfile
              - iam:GetInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/ATU-EC2-IAM-*

          - Sid: PassApplicationRoleToEC2
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ATU-EC2-IAM-*
            Condition:
              StringEquals:
                iam:PassedToService: ec2.amazonaws.com

          - Sid: ManageApplicationEC2Instance
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeImages
              - ec2:DescribeInstanceTypes
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeVolumes
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: "*"
          - Sid: ReadAmazonLinuxAmiParameter
            Effect: Allow
            Action:
              - ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

          - Sid: ControlApplicationInstanceState
            Effect: Allow
            Action:
              - ec2:StopInstances
              - ec2:StartInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/i-050f1033713bc9105

          - Sid: DescribeSSMManagedInstances
            Effect: Allow
            Action:
              - ssm:DescribeInstanceInformation
            Resource: "*"

          - Sid: SendSSMShellDocument
            Effect: Allow
            Action:
              - ssm:SendCommand
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript

          - Sid: SendSSMCommandToApplicationInstance
            Effect: Allow
            Action:
              - ssm:SendCommand
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/i-0a86cb75e6b6d65b4

          - Sid: ReadSSMCommandResults
            Effect: Allow
            Action:
              - ssm:GetCommandInvocation
              - ssm:ListCommandInvocations
            Resource: "*"

          - Sid: DescribeECRRepositories
            Effect: Allow
            Action:
              - ecr:DescribeRepositories
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*

          - Sid: ManageApplicationECRRepository
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:DescribeRepositories
              - ecr:PutLifecyclePolicy
              - ecr:DeleteLifecyclePolicy
              - ecr:PutImageScanningConfiguration
              - ecr:PutImageTagMutability
              - ecr:TagResource
              - ecr:UntagResource
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/atu-ec2-app

  GitHubOIDCDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Permissions to deploy GitHub Actions OIDC infrastructure.

      Groups:
        - !Ref DeveloperGroupName

      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Sid: ManageGitHubOIDCProvider
            Effect: Allow
            Action:
              - iam:CreateOpenIDConnectProvider
              - iam:GetOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:RemoveClientIDFromOpenIDConnectProvider
              - iam:TagOpenIDConnectProvider
              - iam:UntagOpenIDConnectProvider
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com

          - Sid: ManageGitHubActionsRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:GetRole
              - iam:DeleteRole
              - iam:UpdateAssumeRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ATU-GitHub-Actions-ECR

          - Sid: ManageGitHubActionsPolicy
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ATU-GitHub-OIDC-*
Outputs:

  NetworkDeploymentPolicyArn:
    Description: Managed policy ARN
    Value: !Ref NetworkDeploymentPolicy

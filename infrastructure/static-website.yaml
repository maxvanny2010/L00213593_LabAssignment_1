AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ATU CloudFormation Lab - Part A(a).
  Creates a private S3 bucket for static website content.

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketNamePrefix: atu-l00213593-web
      BucketNamespace: account-regional
      # Prevent direct public access to the bucket.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      # Disable ACL-based ownership management.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      # Encrypt objects using Amazon S3 managed keys.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: ATU-CloudFormation-Lab
        - Key: StudentNumber
          Value: L00213593
        - Key: Environment
          Value: Lab
        - Key: Component
          Value: StaticWebsite

  # Authenticate CloudFront requests to the private S3 bucket.
  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "atu-l00213593-oac-${AWS::AccountId}"
        Description: OAC for the ATU static website
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Deliver the static website over HTTPS.
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: ATU DevOps Lab static website
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100

        Origins:
          - Id: WebsiteS3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

        DefaultCacheBehavior:
          TargetOriginId: WebsiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # AWS managed CachingOptimized policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  WebsiteBucketName:
    Description: Name of the private S3 bucket
    Value: !Ref WebsiteBucket

  WebsiteBucketArn:
    Description: ARN of the private S3 bucket
    Value: !GetAtt WebsiteBucket.Arn

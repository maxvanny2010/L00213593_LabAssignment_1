name: Docker Build and ECR Public Publish

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  IMAGE_NAME: atu-ec2-app
  ECR_PUBLIC_REGISTRY: public.ecr.aws
  ECR_PUBLIC_ALIAS: e1c9y1q6
  AWS_REGION: us-east-1

jobs:
  build-and-publish:
    name: Build, Verify and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify Maven modules
        run: mvn -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::897068845214:role/ATU-GitHub-Actions-ECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          aws ecr-public get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_PUBLIC_REGISTRY"

      - name: Tag and push Docker image to ECR Public
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_PUBLIC_REGISTRY}/${ECR_PUBLIC_ALIAS}/${IMAGE_NAME}:${IMAGE_TAG}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          echo "Published Docker image: ${IMAGE_URI}"